name: E2E (Playwright)

# PRs are the gate. main is not re-run after every merge (the PR already ran
# the same suite); it runs once a night instead, as the safety net for a merge
# whose PR base had gone stale. Ruled by Fauzan 2026-10-01: CI "secukupnya".
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'   # 01:00 WIB
  workflow_dispatch:

# A new push to a PR cancels that PR's older, superseded run: on 2026-10-01
# alone 56 e2e runs queued, many for heads that were already replaced. Runs on
# main are never cancelled; each merge keeps its own complete record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Only a PR has a diff to filter; the nightly run always runs everything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      runnable: ${{ steps.filter.outputs.runnable }}
    steps:
      - uses: actions/checkout@v6
      # Pinned to commit SHA per GitHub Actions supply-chain guidance.
      # SHA = dorny/paths-filter v4.0.1 release. Bump explicitly when needed.
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            runnable:
              - '*.html'
              - '*.js'
              - '*.css'
              - '*.webmanifest'
              - 'vercel.json'
              - 'css/**'
              - 'js/**'
              - 'api/**'
              - 'seo/**'
              - 'scripts/**'
              - 'tests/**'
              - 'images/**'
              - 'fonts/**'
              # /en is generated from i18n; core tests read both and the
              # sitemap. Without these a PR touching only them skipped every
              # test and stayed green until the nightly run after merge.
              - 'en/**'
              - 'i18n/**'
              - 'sitemap.xml'
              - 'robots.txt'
              - 'playwright.config.js'
              - 'eslint.config.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'

  e2e:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.runnable == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Keep this order identical to scripts/qa-gate.mjs. A local green must
      # make the same claim as CI, including the headless domain suite.
      - run: npm run lint
      - run: npm run seo:check
      - run: npm run test:core

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
