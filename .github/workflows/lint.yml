name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels that PR's older, superseded run: on 2026-10-01
# alone 56 e2e runs queued, many for heads that were already replaced. Runs on
# main are never cancelled; each merge keeps its own complete record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The SEO tool pages are GENERATED from seo/pages.json + index.html. Without
      # this, editing index.html and forgetting `npm run seo` silently leaves the
      # 12 tool pages on a stale copy of the app shell — and nothing would fail.
      - run: npm run seo:check
