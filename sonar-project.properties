# ---------------------------------------------------------------------------
# ⛔ THIS FILE IS INERT. THE EXCLUSIONS BELOW ARE DECLARED AND NOT APPLIED.
#
# Measured 2026-08-09 against the SonarCloud API, not inferred:
#   - the project runs AUTOMATIC ANALYSIS (the GitHub App auto-scan). No CI
#     workflow invokes a scanner; .github/workflows/ has only e2e, lint and
#     traffic-floor. Analyses ARE current — the most recent ran against HEAD.
#   - automatic analysis does NOT read sonar-project.properties. Exclusions
#     have to be set in the SonarCloud UI.
#   - api/settings/values?keys=sonar.exclusions returns {"settings":[]}, and
#     180 of 556 open issues sit inside the twelve pages listed below.
#
# So everything after this banner describes an INTENT, not a state. It is kept
# because the reasoning is right and is what a UI exclusion should be built
# from — but it was read as settled fact for months, including in a brief that
# quoted its duplication number as "the design", and a protection that asserts
# itself while doing nothing is worse than no protection at all.
#
# TO MAKE IT TRUE: set sonar.exclusions in the SonarCloud UI to the value at the
# bottom of this file. Until someone does, expect duplication and issue counts
# inflated by ~12 copies of every finding in index.html.
#
# ---------------------------------------------------------------------------
# THE INTENT — why generated files SHOULD be excluded.
#
# The twelve SEO tool pages (gabung-pdf.html, kompres-pdf.html, …) are OUTPUT of
# scripts/gen-seo-pages.js, which templates them from index.html. They are
# committed on purpose — that is the whole "a generator is not a build step"
# decision (see the header of gen-seo-pages.js) — but they are artifacts, not
# source.
#
# Analysing them is worse than useless:
#   - Duplication went to 77.6%, because 12 pages each embed the same editor
#     shell. That is the design, not a defect. Nothing can be "fixed" there.
#   - Every finding in index.html gets reported 12 extra times, which buries the
#     one copy that a human can actually act on.
#
# You lint the SOURCE, not the output. The source IS analysed: index.html (the
# template), seo/pages.json (the copy), and scripts/gen-seo-pages.js itself. A
# real bug in a generated page is a bug in one of those three, and Sonar will
# still see it there.
#
# DO NOT add a new tool page to this list by hand — the glob covers them. If you
# ever hand-write an HTML page at the repo root, it must NOT match this pattern,
# or it silently stops being analysed.
# ---------------------------------------------------------------------------
sonar.exclusions=gabung-pdf.html,kompres-pdf.html,kompres-pdf-*.html,pisah-pdf.html,tanda-tangan-pdf.html,pdf-ke-jpg.html,jpg-ke-pdf.html,edit-pdf.html,hapus-halaman-pdf.html,js/vendor/**
