# ---------------------------------------------------------------------------
# THE SONARCLOUD UI HOLDS THE TRUTH. THIS FILE MIRRORS IT.
#
# The project runs AUTOMATIC ANALYSIS (the GitHub App auto-scan; no CI workflow
# invokes a scanner, .github/workflows/ has only e2e and lint). Automatic
# analysis does NOT read this file, so editing it changes nothing by itself.
# The values below are what is set in the SonarCloud UI (Administration >
# General Settings > Analysis Scope) as of 2026-10-01:
#   sonar.exclusions     = the line below
#   sonar.cpd.exclusions = the line below
# If the UI and this file ever disagree, the UI wins and this file gets fixed.
# To change an exclusion: change it in the UI, then mirror it here.
#
# History: until 2026-10-01 these were declared here and NOT applied (measured
# 2026-08-09 against the API: sonar.exclusions was empty and 180 of 556 open
# issues sat inside the generated pages). A protection that asserts itself
# while doing nothing is worse than none, hence the mirror rule above.
#
# WHY generated files are excluded. The SEO tool pages (gabung-pdf.html,
# kompres-pdf.html, ...) are OUTPUT of scripts/gen-seo-pages.js, templated from
# index.html and committed on purpose (a generator is not a build step; see its
# header). They are artifacts, not source. Analysing them reports every
# index.html finding a dozen extra times and pushes duplication to ~77%
# because each page embeds the same editor shell, which is the design. You lint
# the SOURCE: index.html (template), seo/pages.json (copy), and
# scripts/gen-seo-pages.js stay analysed. en/** is the same story, generated
# by scripts/gen-en-page.js and scripts/gen-en-support.js. js/vendor/** is
# third-party code.
#
# WHY the cpd (copy-paste detection) exclusions. js/locales/** holds parallel
# id/en string tables, which duplicate each other by construction.
# tests/**/fixtures/** holds fixture data (PDFs, images, JSON baselines).
#
# The globs: *-pdf.html covers the generated tool pages (gabung-, pisah-,
# tanda-tangan-, edit-, hapus-halaman-, kompres-, jpg-ke-); kompres-pdf-*.html
# the size variants; pdf-ke-jpg.html does not end in -pdf so it is listed by
# name. Hand-written root pages (index, dukung, privasi, alat-gambar, lab*,
# pdf-explained, pdf-xray) match none of them and stay analysed. If you add a
# hand-written page whose name ends in -pdf.html it will silently stop being
# analysed; name it differently.
# ---------------------------------------------------------------------------
sonar.exclusions=*-pdf.html,kompres-pdf-*.html,pdf-ke-jpg.html,en/**,js/vendor/**
sonar.cpd.exclusions=js/locales/**,tests/**/fixtures/**
